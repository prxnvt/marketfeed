[project]
name = "marketfeed"
version = "0.1.0"
description = "Typed, streaming market-data ingestion with pluggable sources."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Pranav" }]
license = { text = "MIT" }
dependencies = []

[project.scripts]
marketfeed = "marketfeed.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marketfeed"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=marketfeed --cov-report=term-missing"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.2",
]
